<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="subtleShad" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Clean Pure White Background -->
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Centered Minimalist Header -->
  <line x1="0" y1="55" x2="800" y2="55" stroke="#f1f5f9" stroke-width="1.5"/>
  <!-- Centered Brand -->
  <text x="350" y="34" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="1">CareerNexaa</text>
  <!-- Nav Links -->
  <rect x="40" y="24" width="45" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="95" y="24" width="45" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="150" y="24" width="45" height="7" rx="3.5" fill="#0f172a"/>
  
  <rect x="680" y="18" width="80" height="20" rx="10" fill="#0f172a"/>
  <text x="704" y="31" font-family="sans-serif" font-size="8" font-weight="700" fill="#ffffff">Subscribe</text>

  <!-- Centered Focal Hero Story -->
  <g filter="url(#subtleShad)">
    <!-- Container -->
    <rect x="120" y="75" width="560" height="195" rx="8" fill="#fafafa" stroke="#e2e8f0"/>
    <!-- Topic Pill -->
    <text x="145" y="102" font-family="sans-serif" font-size="9" font-weight="800" fill="#0f172a" letter-spacing="1">CAREER ESSAY &bull; 6 MIN READ</text>
    <!-- Big Headline -->
    <text x="145" y="128" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#0f172a">How to Build a High-Growth Remote Career in 2026</text>
    <rect x="145" y="142" width="320" height="8" rx="2" fill="#64748b"/>
    <rect x="145" y="156" width="280" height="8" rx="2" fill="#64748b"/>
    <rect x="145" y="170" width="200" height="8" rx="2" fill="#94a3b8"/>

    <!-- Right Image Thumbnail -->
    <rect x="520" y="92" width="135" height="95" rx="6" fill="#334155"/>
    <circle cx="587" cy="140" r="18" fill="#ffffff" opacity="0.2"/>

    <!-- Author & Date -->
    <circle cx="155" cy="225" r="9" fill="#0f172a"/>
    <text x="172" y="228" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Emma Vance</text>
    <text x="240" y="228" font-family="sans-serif" font-size="8" fill="#94a3b8">&bull; Oct 18, 2026</text>

    <text x="615" y="228" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Read Story &rarr;</text>
  </g>

  <!-- TWO-COLUMN EDITORIAL STREAM -->
  <line x1="120" y1="290" x2="680" y2="290" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="120" y="315" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#0f172a">Recent Publications</text>

  <!-- Column 1 -->
  <g>
    <rect x="120" y="330" width="255" height="145" rx="6" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="135" y="352" font-family="sans-serif" font-size="8" font-weight="800" fill="#64748b">INTERVIEW PREP</text>
    <text x="135" y="375" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#0f172a">Mastering Behavioral Frameworks</text>
    <rect x="135" y="388" width="220" height="6" rx="2" fill="#94a3b8"/>
    <rect x="135" y="398" width="160" height="6" rx="2" fill="#cbd5e1"/>
    <circle cx="145" cy="435" r="7" fill="#64748b"/>
    <text x="160" y="438" font-family="sans-serif" font-size="8" fill="#64748b">Oct 17 &bull; 4 min read</text>
  </g>

  <!-- Column 2 -->
  <g>
    <rect x="425" y="330" width="255" height="145" rx="6" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="440" y="352" font-family="sans-serif" font-size="8" font-weight="800" fill="#64748b">RESUME BLUEPRINT</text>
    <text x="440" y="375" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#0f172a">Writing Clean ATS-Proof Resumes</text>
    <rect x="440" y="388" width="220" height="6" rx="2" fill="#94a3b8"/>
    <rect x="440" y="398" width="160" height="6" rx="2" fill="#cbd5e1"/>
    <circle cx="450" cy="435" r="7" fill="#64748b"/>
    <text x="465" y="438" font-family="sans-serif" font-size="8" fill="#64748b">Oct 16 &bull; 5 min read</text>
  </g>
</svg>
