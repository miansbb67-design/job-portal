<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgClassic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="badgeClassic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadowSm" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgClassic)"/>

  <!-- Top Navbar -->
  <rect width="800" height="56" fill="#ffffff" filter="url(#shadowSm)"/>
  <rect x="40" y="18" width="120" height="20" rx="4" fill="#059669"/>
  <rect x="260" y="24" width="45" height="8" rx="4" fill="#64748b"/>
  <rect x="325" y="24" width="45" height="8" rx="4" fill="#64748b"/>
  <rect x="390" y="24" width="55" height="8" rx="4" fill="#059669"/>
  <rect x="465" y="24" width="45" height="8" rx="4" fill="#64748b"/>
  <rect x="620" y="16" width="140" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>

  <!-- HERO SECTION: Split Grid -->
  <!-- Left: Big Spotlight Card (58%) -->
  <g filter="url(#shadowSm)">
    <rect x="40" y="80" width="420" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- Image placeholder -->
    <path d="M 40 92 Q 40 80 52 80 L 448 80 Q 460 80 460 92 L 460 200 L 40 200 Z" fill="#047857" opacity="0.85"/>
    <circle cx="250" cy="140" r="30" fill="#ffffff" opacity="0.15"/>
    <!-- Badge -->
    <rect x="56" y="94" width="105" height="20" rx="10" fill="url(#badgeClassic)"/>
    <text x="64" y="108" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">★ FEATURED GUIDE</text>
    <!-- Content -->
    <rect x="56" y="215" width="280" height="14" rx="4" fill="#0f172a"/>
    <rect x="56" y="235" width="360" height="8" rx="3" fill="#64748b"/>
    <rect x="56" y="247" width="240" height="8" rx="3" fill="#64748b"/>
    <!-- Footer -->
    <circle cx="66" cy="285" r="10" fill="#059669"/>
    <rect x="84" y="280" width="80" height="9" rx="3" fill="#334155"/>
    <rect x="375" y="272" width="70" height="24" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="388" y="288" font-family="sans-serif" font-size="9" font-weight="700" fill="#059669">Read &rarr;</text>
  </g>

  <!-- Right: Live Radar Widget (42%) -->
  <g filter="url(#shadowSm)">
    <rect x="480" y="80" width="280" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- Radar Header -->
    <circle cx="500" cy="102" r="4" fill="#10b981"/>
    <text x="512" y="106" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">Live Job Radar</text>
    <line x1="480" y1="120" x2="760" y2="120" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Radar Item 1 -->
    <rect x="495" y="132" width="40" height="32" rx="4" fill="#e2e8f0"/>
    <rect x="545" y="134" width="70" height="7" rx="3" fill="#059669"/>
    <rect x="545" y="145" width="190" height="9" rx="3" fill="#1e293b"/>
    <rect x="545" y="157" width="90" height="6" rx="2" fill="#94a3b8"/>

    <!-- Radar Item 2 -->
    <rect x="495" y="180" width="40" height="32" rx="4" fill="#e2e8f0"/>
    <rect x="545" y="182" width="80" height="7" rx="3" fill="#2563eb"/>
    <rect x="545" y="193" width="180" height="9" rx="3" fill="#1e293b"/>
    <rect x="545" y="205" width="85" height="6" rx="2" fill="#94a3b8"/>

    <!-- Radar Item 3 -->
    <rect x="495" y="228" width="40" height="32" rx="4" fill="#e2e8f0"/>
    <rect x="545" y="230" width="65" height="7" rx="3" fill="#d97706"/>
    <rect x="545" y="241" width="170" height="9" rx="3" fill="#1e293b"/>
    <rect x="545" y="253" width="75" height="6" rx="2" fill="#94a3b8"/>
  </g>

  <!-- BOTTOM SECTION: 4-Column Grid -->
  <text x="40" y="352" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">Top Career Tracks &amp; Articles</text>
  <g filter="url(#shadowSm)">
    <!-- Card 1 -->
    <rect x="40" y="368" width="168" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="40" y="368" width="168" height="52" rx="8" fill="#cbd5e1"/>
    <rect x="50" y="430" width="130" height="8" rx="2" fill="#1e293b"/>
    <rect x="50" y="444" width="90" height="6" rx="2" fill="#94a3b8"/>

    <!-- Card 2 -->
    <rect x="228" y="368" width="168" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="228" y="368" width="168" height="52" rx="8" fill="#94a3b8"/>
    <rect x="238" y="430" width="125" height="8" rx="2" fill="#1e293b"/>
    <rect x="238" y="444" width="80" height="6" rx="2" fill="#94a3b8"/>

    <!-- Card 3 -->
    <rect x="416" y="368" width="168" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="416" y="368" width="168" height="52" rx="8" fill="#64748b"/>
    <rect x="426" y="430" width="135" height="8" rx="2" fill="#1e293b"/>
    <rect x="426" y="444" width="95" height="6" rx="2" fill="#94a3b8"/>

    <!-- Card 4 -->
    <rect x="604" y="368" width="156" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="604" y="368" width="156" height="52" rx="8" fill="#475569"/>
    <rect x="614" y="430" width="120" height="8" rx="2" fill="#1e293b"/>
    <rect x="614" y="444" width="85" height="6" rx="2" fill="#94a3b8"/>
  </g>
</svg>
