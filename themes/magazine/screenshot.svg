<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowBlue" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="500" fill="url(#bgMag)"/>

  <!-- Top Dark Navbar with Accent -->
  <rect width="800" height="52" fill="#0b1120"/>
  <line x1="0" y1="52" x2="800" y2="52" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="16" width="130" height="20" rx="4" fill="#38bdf8"/>
  <!-- Breaking ticker pill -->
  <rect x="200" y="18" width="60" height="16" rx="8" fill="#ef4444"/>
  <text x="210" y="29" font-family="sans-serif" font-size="8" font-weight="800" fill="#ffffff">TRENDING</text>
  <rect x="270" y="22" width="180" height="8" rx="4" fill="#94a3b8" opacity="0.6"/>

  <rect x="580" y="16" width="60" height="20" rx="10" fill="#1e293b" stroke="#475569"/>
  <rect x="655" y="16" width="105" height="20" rx="10" fill="#2563eb"/>

  <!-- Filter Pills Bar -->
  <rect x="40" y="70" width="80" height="22" rx="11" fill="#2563eb"/>
  <text x="56" y="84" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">All Feeds</text>
  <rect x="130" y="70" width="80" height="22" rx="11" fill="#1e293b" stroke="#334155"/>
  <text x="146" y="84" font-family="sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Tech Jobs</text>
  <rect x="220" y="70" width="70" height="22" rx="11" fill="#1e293b" stroke="#334155"/>
  <text x="235" y="84" font-family="sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Remote</text>
  <rect x="300" y="70" width="60" height="22" rx="11" fill="#1e293b" stroke="#334155"/>
  <text x="314" y="84" font-family="sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Govt</text>

  <!-- MAGAZINE HERO ASYMMETRIC GRID -->
  <!-- Primary Story (Left 60%) -->
  <g filter="url(#glowBlue)">
    <rect x="40" y="105" width="450" height="240" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 40 119 Q 40 105 54 105 L 476 105 Q 490 105 490 119 L 490 230 L 40 230 Z" fill="url(#heroGradient)" opacity="0.9"/>
    <!-- Glass Badge -->
    <rect x="56" y="120" width="90" height="22" rx="11" fill="#0f172a" opacity="0.8" stroke="#38bdf8"/>
    <text x="68" y="134" font-family="sans-serif" font-size="9" font-weight="800" fill="#38bdf8">TECH PULSE</text>
    <!-- Big Headline -->
    <rect x="56" y="245" width="360" height="16" rx="4" fill="#ffffff"/>
    <rect x="56" y="268" width="280" height="10" rx="3" fill="#94a3b8"/>
    <!-- Author & Read time -->
    <circle cx="68" cy="308" r="10" fill="#38bdf8"/>
    <rect x="86" y="304" width="70" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="166" y="304" width="55" height="8" rx="2" fill="#64748b"/>
    <rect x="410" y="296" width="65" height="24" rx="6" fill="#2563eb"/>
    <text x="424" y="312" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">Read &rarr;</text>
  </g>

  <!-- Secondary Stacked Stories (Right 40%) -->
  <!-- Sub-Card 1 -->
  <rect x="510" y="105" width="250" height="72" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="520" y="115" width="50" height="52" rx="6" fill="#3b82f6" opacity="0.8"/>
  <rect x="580" y="120" width="55" height="7" rx="2" fill="#38bdf8"/>
  <rect x="580" y="132" width="160" height="9" rx="2" fill="#ffffff"/>
  <rect x="580" y="146" width="100" height="7" rx="2" fill="#64748b"/>

  <!-- Sub-Card 2 -->
  <rect x="510" y="189" width="250" height="72" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="520" y="199" width="50" height="52" rx="6" fill="#10b981" opacity="0.8"/>
  <rect x="580" y="204" width="65" height="7" rx="2" fill="#34d399"/>
  <rect x="580" y="216" width="165" height="9" rx="2" fill="#ffffff"/>
  <rect x="580" y="230" width="110" height="7" rx="2" fill="#64748b"/>

  <!-- Sub-Card 3 -->
  <rect x="510" y="273" width="250" height="72" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="520" y="283" width="50" height="52" rx="6" fill="#8b5cf6" opacity="0.8"/>
  <rect x="580" y="288" width="60" height="7" rx="2" fill="#a78bfa"/>
  <rect x="580" y="300" width="150" height="9" rx="2" fill="#ffffff"/>
  <rect x="580" y="314" width="90" height="7" rx="2" fill="#64748b"/>

  <!-- BOTTOM: TRENDING LEADERBOARD -->
  <rect x="40" y="365" width="720" height="115" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="388" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8">⚡ MOST READ TODAY</text>
  
  <text x="60" y="420" font-family="sans-serif" font-size="16" font-weight="900" fill="#3b82f6">#1</text>
  <rect x="90" y="410" width="130" height="9" rx="2" fill="#ffffff"/>
  <rect x="90" y="425" width="80" height="6" rx="2" fill="#64748b"/>

  <text x="290" y="420" font-family="sans-serif" font-size="16" font-weight="900" fill="#3b82f6">#2</text>
  <rect x="320" y="410" width="130" height="9" rx="2" fill="#ffffff"/>
  <rect x="320" y="425" width="80" height="6" rx="2" fill="#64748b"/>

  <text x="520" y="420" font-family="sans-serif" font-size="16" font-weight="900" fill="#3b82f6">#3</text>
  <rect x="550" y="410" width="130" height="9" rx="2" fill="#ffffff"/>
  <rect x="550" y="425" width="80" height="6" rx="2" fill="#64748b"/>
</svg>
